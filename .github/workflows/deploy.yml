# Publica a loja no GitHub Pages.
#  - A cada push na branch main, publica a versão atual (deploy normal).
#  - Pela aba Actions > "Deploy no GitHub Pages" > "Run workflow" é possível
#    publicar QUALQUER versão anterior (tag, branch ou commit): é o nosso ROLLBACK.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (tag como v1.0.0, branch ou SHA). Vazio = main"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.versao || github.sha }}

      - name: Carimbar a versão publicada (build-info.json)
        env:
          REF_PUBLICADA: ${{ inputs.versao || github.ref_name }}
          EVENTO: ${{ github.event_name }}
          EXECUCAO: ${{ github.run_number }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"ref":"%s","commit":"%s","dataDeploy":"%s","evento":"%s","execucao":"%s"}\n' \
            "$REF_PUBLICADA" "$COMMIT" "$DATA" "$EVENTO" "$EXECUCAO" > build-info.json
          echo "Publicando $REF_PUBLICADA (commit $COMMIT) — evento: $EVENTO"
          cat build-info.json

      # Ação corretiva do post-mortem (causa 1): impede publicar uma versão
      # cuja configuração aponta para capas que não existem no repositório.
      - name: Validar a release (capas do catálogo)
        shell: python
        run: |
          import json, os, sys

          config = json.load(open("config/app-config.json", encoding="utf-8"))
          pasta = config["pastaCapas"]
          catalogo = json.load(open(config["catalogoUrl"], encoding="utf-8"))

          faltando = [
              os.path.join(pasta, jogo["capa"])
              for jogo in catalogo["jogos"]
              if not os.path.isfile(os.path.join(pasta, jogo["capa"]))
          ]

          print(f"Pasta de capas configurada: {pasta}")
          print(f"Jogos no catálogo: {len(catalogo['jogos'])}")
          if faltando:
              for caminho in faltando:
                  print(f"::error file=config/app-config.json::Capa não encontrada: {caminho}")
              print(f"DEPLOY BLOQUEADO: {len(faltando)} capa(s) não encontrada(s).")
              sys.exit(1)
          print("Validação OK: todas as capas do catálogo existem.")

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
